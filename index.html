<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Compramos Server</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    color: #829b89;
    background: #020603;
    overflow: hidden;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    inset: -50%;
    z-index: 0;
    pointer-events: none;

    background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 55deg,
        rgba(20, 100, 43, 0.13) 85deg,
        transparent 115deg,
        transparent 145deg,
        rgba(15, 85, 35, 0.15) 175deg,
        transparent 205deg,
        transparent 235deg,
        rgba(25, 110, 48, 0.13) 265deg,
        transparent 295deg,
        transparent 360deg
    );

    animation: reverseGlow 35s linear infinite;
}

@keyframes reverseGlow {
    from {
        transform: rotate(360deg);
    }
    to {
        transform: rotate(0deg);
    }
}

.cursor-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;

    background: radial-gradient(
        circle,
        rgba(35, 125, 55, 0.12),
        rgba(20, 80, 35, 0.045) 40%,
        transparent 72%
    );

    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 600px;
    padding: 40px 25px;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: clamp(30px, 5vw, 48px);
    font-weight: 800;
    letter-spacing: -1.8px;
    color: #a0b9a5;
    text-shadow: 0 0 25px rgba(35, 110, 50, 0.12);
}

.subtitle {
    margin-top: 13px;
    color: #58745e;
    font-size: 15px;
}

.buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-top: 35px;
}

.invite-button {
    width: 100%;
    max-width: 340px;
    min-height: 52px;

    display: flex;
    justify-content: center;
    align-items: center;
    padding: 13px 20px;

    border: 1px solid rgba(45, 115, 58, 0.18);
    border-radius: 50px;

    color: #78927d;
    background: linear-gradient(
        110deg,
        #030a04,
        #071109,
        #030a04
    );

    font-size: 14px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;

    box-shadow: 0 5px 18px rgba(0,0,0,0.35);

    transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        color 0.3s ease,
        background 0.3s ease;
}

.invite-button:hover {
    transform: translateY(-2px);

    color: #a8c9ae;

    border-color: rgba(65, 155, 80, 0.42);

    background: linear-gradient(
        110deg,
        #061109,
        #0b1c0e,
        #061109
    );

    box-shadow:
        0 5px 20px rgba(0,0,0,0.4),
        0 0 13px rgba(40, 130, 55, 0.10);
}

.invite-button:active {
    transform: scale(0.985);
}

#status {
    min-height: 18px;
    margin-top: 20px;
    color: #638b6b;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="cursor-glow" id="cursorGlow"></div>

<div class="container">

    <h1>The Compramos Server</h1>

    <p class="subtitle">
        No AntiCheat, No Moderation, Yes Freedom
    </p>

    <div class="buttons">

        <button
            class="invite-button"
            id="copyInvite"
            type="button"
        >
            Copy Compramos Server Invite
        </button>

        <a
            class="invite-button"
            href="https://discord.gg/aRNdStmj2X"
            target="_blank"
            rel="noopener noreferrer"
        >
            Open Compramos Server Invite
        </a>

    </div>

    <p id="status"></p>

</div>

<script>
const invite = "https://discord.gg/aRNdStmj2X";

document.getElementById("copyInvite").addEventListener(
    "click",
    async () => {
        const status = document.getElementById("status");

        try {
            await navigator.clipboard.writeText(invite);
            status.textContent = "Invite copied to clipboard!";
        } catch {
            const field = document.createElement("textarea");
            field.value = invite;
            document.body.appendChild(field);
            field.select();

            const copied = document.execCommand("copy");
            field.remove();

            status.textContent = copied
                ? "Invite copied to clipboard!"
                : "Copy failed. Please copy manually.";
        }
    }
);

const glow = document.getElementById("cursorGlow");

let overButton = false;
let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let currentX = mouseX;
let currentY = mouseY;

document.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    glow.style.opacity = overButton ? "0" : "1";
});

document.querySelectorAll(".invite-button").forEach(button => {
    button.addEventListener("mouseenter", () => {
        overButton = true;
        glow.style.opacity = "0";
    });

    button.addEventListener("mouseleave", () => {
        overButton = false;
        glow.style.opacity = "1";
    });
});

function animateGlow() {
    currentX += (mouseX - currentX) * 0.075;
    currentY += (mouseY - currentY) * 0.075;

    glow.style.left = currentX + "px";
    glow.style.top = currentY + "px";

    requestAnimationFrame(animateGlow);
}

animateGlow();
</script>

</body>
</html>
